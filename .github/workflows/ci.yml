name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-check:
    name: Engine — Check & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guard-rail-engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: guard-rail-engine

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build

  engine-test-fast:
    name: Engine — Fast Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guard-rail-engine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: guard-rail-engine

      - name: Run unit tests
        run: cargo test --lib

      - name: Run integration tests
        run: cargo test --test integration_test

      - name: Run smoke tests
        run: cargo test --test smoke_test

  engine-test-db:
    name: Engine — DB Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: guardrail
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: guardrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardrail -d guardrail"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: guard-rail-engine
    env:
      TEST_DATABASE_URL: postgres://guardrail:secret@127.0.0.1:5432/guardrail
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: guard-rail-engine

      - name: Run audit API tests
        run: cargo test --test audit_api_test

      - name: Run auth integration tests
        run: cargo test --test auth_integration_test

      - name: Run replay integration tests
        run: cargo test --test replay_integration_test

  engine-runtime-smoke:
    name: Engine — Runtime Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: guardrail
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: guardrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardrail -d guardrail"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: guard-rail-engine
    env:
      GUARDRAIL_DATABASE__URL: postgres://guardrail:secret@127.0.0.1:5432/guardrail
      GUARDRAIL_ADMIN__TOKEN: ci-admin-token
      GUARDRAIL_ENVIRONMENT: development
      GUARDRAIL_SERVER__HOST: 127.0.0.1
      GUARDRAIL_SERVER__PORT: 18080
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: guard-rail-engine

      - name: Run runtime startup smoke
        run: ./scripts/ci/runtime-smoke.sh

  frontend-check:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build