routes:
  - id: transfer-api
    auth_mode: tenant_bound
    upstream: https://internal-bank.za/api/v1/transfer
    methods: [POST, PUT]
    policies: [block-external-callbacks, pii-detection]
    timeout_ms: 5000

  - id: partner-webhook
    auth_mode: public
    upstream: https://erp.internal/webhooks/partner
    methods: [POST]
    policies: [payload-size-limit]
    timeout_ms: 3000
