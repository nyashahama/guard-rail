environment: production
server:
  host: "0.0.0.0"
  port: 8080
  request_body_limit_bytes: 1048576

routes_file: "/etc/guard-rail-engine/routes.yaml"
policies_dir: "/etc/guard-rail-engine/policies/"

forwarding:
  default_timeout_ms: 5000
  user_agent: "GuardRail/0.1.0"

logging:
  level: "info"
  format: "json"

database:
  url: ""
  max_connections: 10

audit:
  write_timeout_ms: 250
  persistence_mode: required_before_response

admin:
  token: ""

admin_server:
  host: "127.0.0.1"
  port: 8081

rate_limit:
  requests_per_minute: 120
  burst: 30

replay:
  enabled: true
  capture_request_headers: ["content-type", "accept", "x-request-id"]
  capture_response_headers: ["content-type", "x-upstream-version"]
  max_response_body_bytes: 65536

observability:
  service_name: "guard-rail-engine"
  metrics_enabled: true
  metrics_path: "/metrics"
  trace_header_name: "traceparent"
  readiness_probe_timeout_ms: 250

shutdown:
  grace_period_ms: 15000
  drain_poll_interval_ms: 50

data_ops:
  audit_retention_days: 180
  artifact_retention_days: 30
  replay_run_retention_days: 30
  orphan_snapshot_retention_days: 30
  cleanup_batch_size: 1000
