# Local development sample only. The blessed container deployment path mounts
# deploy/container/config.yaml (or an equivalent production config) at runtime.
environment: development
server:
  host: "0.0.0.0"
  port: 8080
  request_body_limit_bytes: 1048576

routes_file: "./config/routes.yaml"
policies_dir: "./config/policies/"

forwarding:
  default_timeout_ms: 5000
  user_agent: "GuardRail/0.1.0"

logging:
  level: "info"
  format: "json"

database:
  url: "postgres://guardrail:secret@localhost:5432/guardrail"
  max_connections: 10

audit:
  write_timeout_ms: 250

admin:
  token: "change-me"
